<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LS Open World 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .touch-btn {
      transition: transform 0.08s ease, background-color 0.15s ease;
    }
    .touch-btn:active {
      transform: scale(0.94);
    }
    .gta-tile {
      position: relative;
      overflow: hidden;
      border: 3px solid #f8fafc;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
    }
    .gta-badge {
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 3px 0 #020617, 0 6px 16px rgba(0, 0, 0, 0.9);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="gameCanvas" class="block w-full h-full"></canvas>

  <!-- Automatischer Ladebildschirm mit eigenem Bild-Slot aus dem Repo -->
  <div id="loadingScreen" class="fixed inset-0 z-50 flex flex-col justify-between bg-slate-950 p-3 sm:p-6 text-white">
    <!--
      BILD-SLOT FÜR DEIN REPO:
      Lege dein Bild einfach als "loading-screen.jpg" (oder passe src="" auf z.B. "./assets/loading.png")
      neben die index.html im Repository.
    -->
    <div class="relative flex-1 min-h-0 rounded-2xl overflow-hidden border-2 border-slate-700/80 shadow-2xl bg-slate-900">
      <img
        id="repoLoadingImage"
        src="./loading-screen.jpg"
        alt="Ladebildschirm Grafik"
        class="w-full h-full object-cover"
      />

      <!-- Fallback-Collage, falls ./loading-screen.jpg im Repo noch nicht liegt -->
      <div id="repoFallbackGrid" class="hidden absolute inset-0 grid grid-cols-2 md:grid-cols-3 gap-2.5 sm:gap-3.5 p-2.5 sm:p-3.5 bg-slate-950">
        <div class="gta-tile rounded-xl bg-gradient-to-br from-sky-500 via-blue-700 to-slate-950 flex items-end p-3">
          <span class="gta-badge text-sm sm:text-xl text-sky-200">Luftraum</span>
        </div>
        <div class="gta-tile rounded-xl bg-gradient-to-tr from-fuchsia-900 via-rose-700 to-amber-500 flex items-end p-3">
          <span class="gta-badge text-sm sm:text-xl text-amber-200">Straßen-Action</span>
        </div>
        <div class="gta-tile rounded-xl bg-gradient-to-br from-amber-600 via-stone-800 to-slate-950 flex items-end p-3">
          <span class="gta-badge text-sm sm:text-xl text-amber-300">Kopfgeld</span>
        </div>
        <div class="gta-tile rounded-xl bg-gradient-to-br from-indigo-900 via-slate-800 to-cyan-700 flex items-end p-3">
          <span class="gta-badge text-sm sm:text-xl text-cyan-200">Feuerkraft</span>
        </div>
        <div class="gta-tile rounded-xl bg-gradient-to-b from-slate-800 via-slate-900 to-black flex flex-col items-center justify-center p-3 text-center">
          <div class="text-xl sm:text-3xl font-black italic tracking-tight text-white drop-shadow">
            LOS SANTOS <span class="text-amber-400">3D</span>
          </div>
          <div class="mt-1 inline-block px-2.5 py-0.5 rounded bg-rose-600 text-[10px] sm:text-xs font-black tracking-widest uppercase text-white">
            OPEN WORLD
          </div>
        </div>
        <div class="gta-tile rounded-xl bg-gradient-to-tr from-purple-950 via-pink-700 to-orange-500 flex items-end p-3">
          <span class="gta-badge text-sm sm:text-xl text-pink-200">Nacht & Drift</span>
        </div>
      </div>
    </div>

    <!-- Ladebalken unten -->
    <div class="mt-3 sm:mt-4 glass-panel rounded-2xl p-3 sm:p-4 space-y-2">
      <div class="flex items-center justify-between text-xs sm:text-sm font-black">
        <span id="loadingStatus" class="text-amber-300">Lade Los Santos & Fahrzeuge…</span>
        <span id="loadingPercent" class="text-white tabular-nums">0%</span>
      </div>
      <div class="h-2.5 w-full rounded-full bg-slate-900 border border-slate-700 overflow-hidden">
        <div id="loadingBarFill" class="h-full bg-gradient-to-r from-amber-400 via-rose-500 to-sky-400 transition-all duration-100" style="width:0%"></div>
      </div>
      <div class="text-[11px] text-slate-300 truncate">
        WASD / Pfeile: Bewegen • F: Ein-/Aussteigen • Q: Waffenrad • V: Feuern • X: Nachladen • B: Schutzweste • J: Auftrag • R: Radio • T: Tuning • H: Hupe
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hudOverlay" class="hidden fixed inset-0 z-10 pointer-events-none">
    <div class="fixed top-4 left-4 glass-panel rounded-2xl px-3.5 py-2 text-white space-y-1">
      <div class="flex items-center gap-3">
        <span id="cashText" class="text-sm font-black text-emerald-400 tabular-nums">15.000 €</span>
        <span id="wantedText" class="text-xs font-black tracking-widest text-amber-300">☆☆☆☆☆</span>
      </div>
      <div class="flex items-center gap-2 text-[11px] text-slate-300">
        <span id="modeText">Zu Fuß</span>
        <span>•</span>
        <button id="toggleNightBtn" type="button" class="pointer-events-auto underline text-amber-300">Tag/Nacht</button>
      </div>
    </div>

    <div class="fixed bottom-4 left-4 flex gap-2 pointer-events-auto">
      <button id="enterExitBtn" type="button" class="touch-btn px-3.5 h-11 rounded-xl glass-panel text-xs font-black text-white">F: Einsteigen</button>
    </div>

    <div id="toastEl" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 glass-panel px-4 py-2 rounded-xl text-xs font-black text-amber-300"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('gameCanvas');
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingBarFill = document.getElementById('loadingBarFill');
    const loadingPercent = document.getElementById('loadingPercent');
    const loadingStatus = document.getElementById('loadingStatus');
    const repoLoadingImage = document.getElementById('repoLoadingImage');
    const repoFallbackGrid = document.getElementById('repoFallbackGrid');
    const hudOverlay = document.getElementById('hudOverlay');
    const toastEl = document.getElementById('toastEl');

    repoLoadingImage.addEventListener('error', () => {
      repoLoadingImage.classList.add('hidden');
      repoFallbackGrid.classList.remove('hidden');
    });

    let gameStarted = false;
    function finishLoadingAndEnterGame() {
      if (gameStarted) return;
      gameStarted = true;
      loadingBarFill.style.width = '100%';
      loadingPercent.textContent = '100%';
      loadingScreen.classList.add('hidden');
      hudOverlay.classList.remove('hidden');
      if (typeof updateCashUI === 'function') updateCashUI();
      if (typeof updateHealthArmorUI === 'function') updateHealthArmorUI();
    }

    const loadSteps = [
      { pct: 22, text: 'Generiere Straßennetz & Gebäude…' },
      { pct: 48, text: 'Spawne Verkehr, Fußgänger & Polizei…' },
      { pct: 74, text: 'Rüste Waffen, Schutzwesten & Radio aus…' },
      { pct: 95, text: 'Kalibriere Minimap & LS Customs…' },
      { pct: 100, text: 'Bereit!' }
    ];
    let stepIdx = 0;
    const loadTimer = setInterval(() => {
      if (stepIdx < loadSteps.length) {
        const s = loadSteps[stepIdx++];
        loadingBarFill.style.width = s.pct + '%';
        loadingPercent.textContent = s.pct + '%';
        loadingStatus.textContent = s.text;
      } else {
        clearInterval(loadTimer);
        finishLoadingAndEnterGame();
      }
    }, 320);
    setTimeout(finishLoadingAndEnterGame, 2400);

    try {
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.FogExp2(0x38bdf8, 0.0028);

      const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.2, 700);
      const skyDome = new THREE.Mesh(
        new THREE.SphereGeometry(520, 24, 16),
        new THREE.MeshBasicMaterial({ color: 0x0284c7, side: THREE.BackSide })
      );
      scene.add(skyDome);

      const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.1);
      scene.add(hemiLight);
      const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.6);
      dirLight.position.set(80, 120, 60);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(900, 900),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.85 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const axisLines = [-300, -200, -100, 0, 100, 200, 300];
      const zLines = [-280, -180, -80, 20, 120, 220, 320];
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
      axisLines.forEach((x) => {
        const r = new THREE.Mesh(new THREE.PlaneGeometry(14, 860), roadMat);
        r.rotation.x = -Math.PI / 2;
        r.position.set(x, 0.02, 0);
        scene.add(r);
      });
      zLines.forEach((z) => {
        const r = new THREE.Mesh(new THREE.PlaneGeometry(860, 14), roadMat);
        r.rotation.x = -Math.PI / 2;
        r.position.set(0, 0.02, z);
        scene.add(r);
      });

      function makeWindowTexture() {
        const c = document.createElement('canvas');
        c.width = 128;
        c.height = 128;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#fde68a';
        for (let y = 12; y < 120; y += 22) {
          for (let x = 12; x < 120; x += 22) {
            ctx.fillRect(x, y, 10, 12);
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 4);
        return tex;
      }
      const winTex = makeWindowTexture();
      const buildingStyles = [
        new THREE.MeshStandardMaterial({ map: winTex, roughness: 0.5, metalness: 0.2 }),
        new THREE.MeshStandardMaterial({ color: 0x475569, map: winTex, roughness: 0.6, metalness: 0.3 })
      ];
      const buildingBoxes = [];
      for (let gx = -250; gx <= 250; gx += 100) {
        for (let gz = -230; gz <= 270; gz += 100) {
          if ((gx === 0 && gz === 20) || (gx === -100 && gz === 20)) continue;
          const h = 18 + ((Math.abs(gx * 7 + gz * 13)) % 36);
          const w = 26 + ((Math.abs(gx + gz)) % 14);
          const b = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, w),
            buildingStyles[(Math.abs(gx + gz) / 100) % buildingStyles.length]
          );
          b.position.set(gx, h / 2, gz);
          b.castShadow = true;
          b.receiveShadow = true;
          scene.add(b);
          buildingBoxes.push({ minX: gx - w / 2, maxX: gx + w / 2, minZ: gz - w / 2, maxZ: gz + w / 2, h });
        }
      }
      function isBlockedAt(x, z) {
        for (let i = 0; i < buildingBoxes.length; i++) {
          const b = buildingBoxes[i];
          if (x > b.minX - 0.8 && x < b.maxX + 0.8 && z > b.minZ - 0.8 && z < b.maxZ + 0.8) return true;
        }
        return false;
      }
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8, roughness: 0.15, metalness: 0.8, transparent: true, opacity: 0.65
      });

      function createCharacter(shirtHex) {
        const root = new THREE.Group();
        const torso = new THREE.Mesh(
          new THREE.BoxGeometry(0.65, 0.85, 0.35),
          new THREE.MeshStandardMaterial({ color: shirtHex })
        );
        torso.position.y = 1.15;
        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.24, 12, 12),
          new THREE.MeshStandardMaterial({ color: 0xf1c27d })
        );
        head.position.y = 1.85;
        const leftArm = new THREE.Group();
        leftArm.position.set(-0.45, 1.5, 0);
        const lArmMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.22, 0.72, 0.22),
          new THREE.MeshStandardMaterial({ color: shirtHex })
        );
        lArmMesh.position.y = -0.32;
        leftArm.add(lArmMesh);

        const rightArm = new THREE.Group();
        rightArm.position.set(0.45, 1.5, 0);
        const rArmMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.22, 0.72, 0.22),
          new THREE.MeshStandardMaterial({ color: shirtHex })
        );
        rArmMesh.position.y = -0.32;
        rightArm.add(rArmMesh);

        const leftLeg = new THREE.Group();
        leftLeg.position.set(-0.18, 0.72, 0);
        const lLegMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.24, 0.72, 0.26),
          new THREE.MeshStandardMaterial({ color: 0x1e293b })
        );
        lLegMesh.position.y = -0.36;
        leftLeg.add(lLegMesh);

        const rightLeg = new THREE.Group();
        rightLeg.position.set(0.18, 0.72, 0);
        const rLegMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.24, 0.72, 0.26),
          new THREE.MeshStandardMaterial({ color: 0x1e293b })
        );
        rLegMesh.position.y = -0.36;
        rightLeg.add(rLegMesh);

        root.add(torso, head, leftArm, rightArm, leftLeg, rightLeg);
        scene.add(root);
        return { root, parts: { leftArm, rightArm, leftLeg, rightLeg } };
      }
      const activeChar = createCharacter(0xef4444);
      activeChar.root.position.set(0, 0, 20);

      function createSportsCar(colorHex, zPos) {
        const grp = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(2.0, 0.72, 4.4),
          new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.25, metalness: 0.7 })
        );
        body.position.y = 0.65;
        body.castShadow = true;
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.56, 2.0), glassMat);
        cabin.position.set(0, 1.22, -0.2);
        const wheels = [];
        [[-1.05, 0.42, 1.35], [1.05, 0.42, 1.35], [-1.05, 0.42, -1.35], [1.05, 0.42, -1.35]].forEach(([wx, wy, wz]) => {
          const w = new THREE.Mesh(
            new THREE.CylinderGeometry(0.42, 0.42, 0.32, 14),
            new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 })
          );
          w.rotation.z = Math.PI / 2;
          w.position.set(wx, wy, wz);
          grp.add(w);
          wheels.push(w);
        });
        grp.add(body, cabin);
        grp.position.set(6, 0, zPos);
        scene.add(grp);
        return { grp, wheels };
      }
      const porsche = createSportsCar(0xdc2626, 26);
      const lambo = createSportsCar(0xeab308, 34);
      const porscheGroup = porsche.grp;
      const lamboGroup = lambo.grp;

      const timePresets = [{ isNight: false }, { isNight: true }];
      const gameState = {
        cash: 15000,
        wantedLevel: 0,
        inVehicle: false,
        vehicleType: 'porsche',
        godMode: false,
        flyMode: false,
        heistActive: null,
        timeIndex: 0,
        weatherIndex: 0,
        health: 100,
        armor: 60,
        dead: false,
        carDamage: 0,
        engineStage: 0,
        paintIdx: 0
      };
      let carSpeed = 0, camYaw = 0, camPitch = 0.22, walkCycle = 0;
      const pursuitUnits = [];

      function formatMoney(n) { return Math.round(n).toLocaleString('de-DE') + ' €'; }
      function updateCashUI() { document.getElementById('cashText').textContent = formatMoney(gameState.cash); }
      function saveAccountToStorage() {
        try {
          localStorage.setItem('ls_open_world_save', JSON.stringify({
            cash: gameState.cash, engineStage: gameState.engineStage, paintIdx: gameState.paintIdx
          }));
        } catch (e) {}
      }
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.remove('hidden');
        clearTimeout(showToast.t);
        showToast.t = setTimeout(() => toastEl.classList.add('hidden'), 2000);
      }
      function setWantedLevel(lvl) {
        gameState.wantedLevel = Math.max(0, Math.min(5, Math.round(lvl)));
        document.getElementById('wantedText').textContent = '★'.repeat(gameState.wantedLevel) + '☆'.repeat(5 - gameState.wantedLevel);
        while (pursuitUnits.length < gameState.wantedLevel) {
          const cop = new THREE.Group();
          const b = new THREE.Mesh(
            new THREE.BoxGeometry(1.9, 0.75, 4.2),
            new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.35, metalness: 0.6 })
          );
          b.position.y = 0.65;
          const siren = new THREE.Mesh(
            new THREE.BoxGeometry(0.9, 0.2, 0.35),
            new THREE.MeshBasicMaterial({ color: 0xef4444 })
          );
          siren.position.y = 1.12;
          cop.add(b, siren);
          const angle = Math.random() * Math.PI * 2;
          const p = activeChar.root.position;
          cop.position.set(p.x + Math.cos(angle) * 45, 0, p.z + Math.sin(angle) * 45);
          cop.userData = { isHeli: false, hp: 70, siren };
          scene.add(cop);
          pursuitUnits.push(cop);
        }
        if (gameState.wantedLevel === 0) {
          pursuitUnits.forEach((u) => scene.remove(u));
          pursuitUnits.length = 0;
        }
      }
      function placePlayerAtSpawn() {
        gameState.inVehicle = false;
        activeChar.root.visible = true;
        activeChar.root.position.set(0, 0, 20);
        document.getElementById('modeText').textContent = 'Zu Fuß';
        document.getElementById('enterExitBtn').textContent = 'F: Einsteigen';
      }
      function toggleVehicle() {
        if (gameState.dead) return;
        if (gameState.inVehicle) {
          gameState.inVehicle = false;
          const carGrp = gameState.vehicleType === 'lambo' ? lamboGroup : porscheGroup;
          activeChar.root.position.set(carGrp.position.x - 2.4, 0, carGrp.position.z);
          activeChar.root.visible = true;
          document.getElementById('modeText').textContent = 'Zu Fuß';
          document.getElementById('enterExitBtn').textContent = 'F: Einsteigen';
        } else {
          const p = activeChar.root.position;
          const dP = p.distanceTo(porscheGroup.position);
          const dL = p.distanceTo(lamboGroup.position);
          const chosen = dL < dP && dL < 9 ? 'lambo' : (dP < 9 ? 'porsche' : null);
          if (!chosen) { showToast('Kein Fahrzeug in der Nähe!'); return; }
          gameState.inVehicle = true;
          gameState.vehicleType = chosen;
          activeChar.root.visible = false;
          document.getElementById('modeText').textContent = chosen === 'lambo' ? 'Lamborghini' : 'Porsche';
          document.getElementById('enterExitBtn').textContent = 'F: Aussteigen';
        }
      }
      document.getElementById('enterExitBtn').addEventListener('click', toggleVehicle);
      document.getElementById('toggleNightBtn').addEventListener('click', () => {
        gameState.timeIndex = (gameState.timeIndex + 1) % timePresets.length;
        const night = timePresets[gameState.timeIndex].isNight;
        scene.background.setHex(night ? 0x090d1a : 0x38bdf8);
        scene.fog.color.setHex(night ? 0x090d1a : 0x38bdf8);
        skyDome.material.color.setHex(night ? 0x050814 : 0x0284c7);
        hemiLight.intensity = night ? 0.35 : 1.1;
        dirLight.intensity = night ? 0.25 : 1.6;
      });

      const keys = {};
      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
        if (e.code === 'KeyF') toggleVehicle();
      });
      window.addEventListener('keyup', (e) => { keys[e.code] = false; });

      let dragging = false, lastX = 0, lastY = 0;
      canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
      window.addEventListener('pointerup', () => { dragging = false; });
      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        camYaw -= (e.clientX - lastX) * 0.0055;
        camPitch = Math.max(-0.25, Math.min(0.85, camPitch + (e.clientY - lastY) * 0.0045));
        lastX = e.clientX; lastY = e.clientY;
      });

      // HUD HP & Panzerung
      const hpBox = document.createElement('div');
      hpBox.className = 'fixed bottom-3 left-1/2 -translate-x-1/2 z-20 w-28 sm:w-44 pointer-events-none space-y-1';
      hpBox.innerHTML =
        '<div class="h-2 rounded bg-slate-900/80 border border-slate-600 overflow-hidden"><div id="hpFill" class="h-full bg-emerald-500" style="width:100%"></div></div>' +
        '<div class="h-1.5 rounded bg-slate-900/80 border border-slate-600 overflow-hidden"><div id="armorFill" class="h-full bg-sky-500" style="width:60%"></div></div>';
      hudOverlay.appendChild(hpBox);

      const wastedEl = document.createElement('div');
      wastedEl.className = 'hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/60 pointer-events-none';
      wastedEl.innerHTML = '<div style="font-weight:900;font-size:clamp(3rem,16vw,9rem);color:#b91c1c;letter-spacing:.06em;text-shadow:0 6px 30px #000">WASTED</div>';
      document.body.appendChild(wastedEl);

      function updateHealthArmorUI() {
        document.getElementById('hpFill').style.width = Math.max(0, gameState.health) + '%';
        document.getElementById('armorFill').style.width = Math.max(0, gameState.armor) + '%';
      }
      function applyDamage(amount) {
        if (amount <= 0 || gameState.dead || gameState.godMode) return;
        const absorbed = Math.min(gameState.armor || 0, amount);
        gameState.armor = (gameState.armor || 0) - absorbed;
        const rem = amount - absorbed;
        if (rem > 0) gameState.health = Math.max(0, gameState.health - rem);
        updateHealthArmorUI();
      }
      function playerDie() {
        if (gameState.dead) return;
        gameState.dead = true;
        wastedEl.classList.remove('hidden');
        canvas.style.filter = 'grayscale(1) contrast(1.15)';
        setTimeout(() => {
          const fee = Math.min(gameState.cash, 5000);
          gameState.cash -= fee;
          updateCashUI();
          gameState.health = 100;
          gameState.armor = 60;
          gameState.carDamage = 0;
          gameState.dead = false;
          carSpeed = 0;
          updateHealthArmorUI();
          setWantedLevel(0);
          placePlayerAtSpawn();
          canvas.style.filter = '';
          wastedEl.classList.add('hidden');

      let gunMesh = null, gunFor = -1;
      function buildGun(i) {
        const w = WEAPONS[i], g = new THREE.Group();
        if (w.melee) return g;

      function selectWeapon(i) { wIdx = Math.max(0, Math.min(WEAPONS.length - 1, i)); reloadT = 0; showToast(WEAPONS[wIdx].name); }
      function getTargets() {
        const t = [];
        pursuitUnits.forEach((u) => t.push({ o: u, k: 'cop', r: 2.1, c: new THREE.Vector3(u.position.x, 1, u.position.z) }));
        peds.forEach((p) => { if (!p.userData.hit) t.push({ o: p, k: 'ped', r: 0.75, c: new THREE.Vector3(p.position.x, 1, p.position.z) }); });

      function raySphere(o, d, c, r) {
        const oc = c.clone().sub(o), tca = oc.dot(d);

      function dmgTarget(t, dmg) {

          setWantedLevel(Math.max(gameState.wantedLevel, 1));

      }
      function explode(pos, radius, dmg) {
        const m = new THREE.Mesh(
          new THREE.SphereGeometry(1, 14, 12),
          new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.85 })
        );

        if (activeChar.root.position.distanceTo(pos) < radius) applyDamage(70 * (1 - activeChar.root.position.distanceTo(pos) / radius));
      }
      function shotSound(w) {
        try {
          ensureAudio(); if (!audioCtx) return;
          const len = Math.floor(audioCtx.sampleRate * (w.pel > 1 || w.rocket ? 0.25 : 0.1));
          const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), ch = buf.getChannelData(0);
          for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
          const s = audioCtx.createBufferSource(), g = audioCtx.createGain();
          s.buffer = buf; g.gain.value = 0.25;
          s.connect(g).connect(audioCtx.destination);
          s.start();
        } catch (e) {}
      }
      function startReload() { const w = WEAPONS[wIdx], a = ammo[wIdx]; if (!a || reloadT > 0 || a.mag >= w.mag || a.res <= 0) return; reloadT = w.reload; }
      function fire() {
        const w = WEAPONS[wIdx], a = ammo[wIdx], p = activeChar.root.position;
        if (a) { if (a.mag <= 0) { startReload(); return; } a.mag--; }
        fireCd = w.rate;

        let dir = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));

        if (best) dir = best.c.clone().sub(origin).normalize();
        activeChar.root.rotation.y = Math.atan2(dir.x, dir.z);

        for (let i = wShots.length - 1; i >= 0; i--) {

              camYaw = carObj.grp.rotation.y;
            }
            const nx = carObj.grp.position.x + Math.sin(carObj.grp.rotation.y) * carSpeed * dt;
            const nz = carObj.grp.position.z + Math.cos(carObj.grp.rotation.y) * carSpeed * dt;
            if (!isBlockedAt(nx, nz)) { carObj.grp.position.x = nx; carObj.grp.position.z = nz; }
            else carSpeed = -carSpeed * 0.3;
            carObj.wheels.forEach((w) => { w.rotation.x += carSpeed * dt * 2.2; });
            activeChar.root.position.copy(carObj.grp.position);
          } else {
            const inputMag = Math.hypot(moveF, moveR);
            if (inputMag > 0) {
              const forward = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
              const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
              const dir = forward.multiplyScalar(moveF).add(right.multiplyScalar(moveR)).normalize();
              const spd = (keys['ShiftLeft'] || keys['ShiftRight']) ? 14 : 7.5;
              const nx = activeChar.root.position.x + dir.x * spd * dt;
              const nz = activeChar.root.position.z + dir.z * spd * dt;
              if (!isBlockedAt(nx, nz)) { activeChar.root.position.x = nx; activeChar.root.position.z = nz; }
              activeChar.root.rotation.y = Math.atan2(dir.x, dir.z);
              walkCycle += dt * spd * 1.6;
            } else {
              walkCycle *= 0.8;
            }
            const swing = Math.sin(walkCycle) * 0.65;
            activeChar.parts.leftLeg.rotation.x = swing;
            activeChar.parts.rightLeg.rotation.x = -swing;
            activeChar.parts.leftArm.rotation.x = -swing * 0.7;
            if (WEAPONS[wIdx].melee) activeChar.parts.rightArm.rotation.x = swing * 0.7;
          }

          pursuitUnits.forEach((u) => {
            const dx = activeChar.root.position.x - u.position.x;
            const dz = activeChar.root.position.z - u.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 4) {
              u.rotation.y = Math.atan2(dx, dz);
              const sp = 13 + gameState.wantedLevel * 2;
              const nx = u.position.x + (dx / dist) * sp * dt;
              const nz = u.position.z + (dz / dist) * sp * dt;
              if (!isBlockedAt(nx, nz)) { u.position.x = nx; u.position.z = nz; }
            }
            if (u.userData.siren) {
              u.userData.siren.material.color.setHex(Math.floor(now / 180) % 2 === 0 ? 0xef4444 : 0x3b82f6);
            }
          });
        }

        const curPos = activeChar.root.position;
        const camDist = gameState.inVehicle ? 9.5 : 6.2;
        const camH = 1.6 + Math.sin(camPitch) * camDist;
        const horizDist = Math.cos(camPitch) * camDist;
        camera.position.set(
          curPos.x - Math.sin(camYaw) * horizDist,
          Math.max(1.2, curPos.y + camH),
          curPos.z - Math.cos(camYaw) * horizDist
        );
        camera.lookAt(curPos.x, curPos.y + 1.4, curPos.z);

        updateExtras(dt, elapsed, curPos);
        updateWeapons(dt, curPos);
        updateArmorSystem(dt, elapsed, curPos);
        updateBountyJobs(dt);
        updateRadio(dt);
        drawMinimap(curPos);
        updateTuningAndDamage(curPos);

        skyDome.position.copy(camera.position);
        renderer.render(scene, camera);
      }
      requestAnimationFrame(animate);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    } catch (err) {
      console.error(err);
      finishLoadingAndEnterGame();
    }
  </script>
</body>
</html>
